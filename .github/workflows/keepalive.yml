# Free Supabase projects pause after a week without activity. This calls the public ping() RPC
# (anon key, no data) once a week and fails visibly (GitHub emails the owner) if it does not
# answer `true`. GitHub also disables scheduled workflows after 60 days without repository
# activity; any push or merged PR re-arms it.
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Call ping()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Call the ping RPC
        run: |
          set -euo pipefail
          for name in SUPABASE_PROJECT_REF SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error title=Missing configuration::$name is not set"; exit 1; fi
          done
          response=$(curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 5 \
            --request POST "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/ping" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}')
          echo "ping() answered: $response"
          if [ "$response" != "true" ]; then
            echo "::error title=ping() failed::Expected true, got: $response"
            exit 1
          fi
